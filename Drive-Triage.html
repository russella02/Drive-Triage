<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Drive Triage</title>
<script>
  // Apply the saved theme before first paint (no flash). app.js keeps it in sync afterwards.
  (function () {
    var pref = 'system';
    try { pref = localStorage.getItem('drive-triage-theme') || 'system'; } catch (e) { /* storage blocked */ }
    if (pref !== 'light' && pref !== 'dark') pref = 'system';
    var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme-pref', pref);
  })();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <h1 class="brand">Drive Triage</h1>
  <button type="button" class="folder" id="folder" hidden title="Choose a different folder"></button>
  <span class="status" id="status" role="status" aria-live="polite"></span>
  <span class="sp"></span>
  <div class="seg" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="system" aria-pressed="false">System</button>
    <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
  </div>
  <button type="button" class="btn fill" id="rescan" hidden>Rescan</button>
  <button type="button" class="btn" id="print-all" hidden>Print all labels</button>
</header>

<div class="app" id="app">
  <nav class="rail" id="rail" aria-labelledby="rail-head" hidden>
    <h2 class="sc rail-head" id="rail-head">Drives · worst first</h2>
    <ul class="drive-list" id="drive-list" role="listbox" tabindex="0" aria-labelledby="rail-head"></ul>
  </nav>
  <main class="main" id="main" tabindex="-1">
    <section class="intro" aria-labelledby="intro-head">
      <h2 class="intro-head" id="intro-head">Drive Triage</h2>
      <p class="intro-text">Loading…</p>
    </section>
  </main>
</div>

<div id="print-area" aria-hidden="true"></div>

<input type="file" id="dir-input" webkitdirectory multiple hidden>
<script src="analysis.js"></script>
<script src="app.js"></script>
</body>
</html>
